# 운영 Hedwig(/home/egov/hedwig/, 실제 외부 메일 수신) 전용 게이트웨이 - 25번 포트에서
# 실제 외부 메일을 받아 운영 Hedwig(내부 전용 포트 2599)로 토스한다.
# 25/143은 privileged 포트이므로 게이트웨이도 root로 기동해야 한다(운영 Hedwig와 동일).
# node1/node2용 데모 인스턴스(conf/application.yml, application-node2.yml)와 포트가 겹치지
# 않도록 outbound/actuator 포트를 전부 시프트했다.
server:
  port: 18093

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

spring:
  datasource:
    url: jdbc:h2:mem:gateway-prod;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

gateway:
  instance-id: gateway-prod
  listen-port: 25
  reuse-port: false
  db-dialect: ansi
  backend:
    host: 127.0.0.1
    port: 2599   # 운영 Hedwig(기존 25번에서 이전)
  rate-limit:
    window-seconds: 10
    threshold: 100
  ban:
    default-duration-minutes: 60
    poll-interval-seconds: 5
  failover:
    policy: fail-open
  os-block:
    enabled: false
  outbound:
    enabled: true
    bind-host: 0.0.0.0
    listen-port: 2526
    reuse-port: false
    spool-dir: /home/egov/hedwig_spam_prod/spool/outbound
    max-retries: 5
    retry-delay-seconds: 120
    delay-after-retries: 2
    worker-pool-size: 5
    worker-max-pool-size: 10
    delay-worker-pool-size: 2
    delay-worker-max-pool-size: 4
    dns-timeout-millis: 5000
    smtp-connect-timeout-millis: 5000
    smtp-timeout-millis: 5000
    auth-required: false
  rbl:
    enabled: true
    zones:
      - zen.spamhaus.org
      - bl.spamcop.net
    timeout-millis: 3000
  greylist:
    enabled: true
    min-retry-delay-minutes: 5   # 운영이므로 데모용 1분이 아닌 표준값(postgrey 기본) 사용
    max-window-hours: 24
    trust-period-days: 30
  rule-filter:
    enabled: true
    spam-threshold: 5.0
  mail-list:
    enabled: true
    blacklist-action: reject
  admin:
    api-key:   # 운영 배포 시 반드시 설정 (미설정 상태로 방치 금지)
