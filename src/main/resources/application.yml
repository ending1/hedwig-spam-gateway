# server.port(Actuator용 내장 웹서버)는 SO_REUSEPORT 대상이 아니므로 인스턴스마다 반드시 다르게 지정해야 한다.
# 예: instance1 -> --server.port=8090 --gateway.instance-id=gateway-1
#     instance2 -> --server.port=8091 --gateway.instance-id=gateway-2
# 반면 gateway.listen-port(실제 SMTP 릴레이 포트)는 Linux에서 reuse-port=true면 인스턴스끼리 공유 가능하다.
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

spring:
  datasource:
    # 현장 설치 시 Hedwig이 사용 중인 동일 RDBMS 접속 정보로 교체한다 (default.properties의 jdbc.* 참고).
    url: jdbc:h2:mem:gateway;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

gateway:
  instance-id: gateway-1
  listen-port: 2525
  # Linux epoll SO_REUSEPORT로 동일 listen-port를 여러 인스턴스가 공유 (스펙 3.1). 비-Linux에서는 무시되고
  # 일반 NIO로 폴백하므로, 그런 환경에서는 인스턴스마다 listen-port를 다르게 지정해야 한다.
  reuse-port: true
  db-dialect: ansi
  backend:
    host: 127.0.0.1
    port: 25
  rate-limit:
    window-seconds: 10
    threshold: 100
  ban:
    default-duration-minutes: 60
    poll-interval-seconds: 5
  failover:
    policy: fail-open
  os-block:
    enabled: false
  # 아웃바운드 완충 장치 - Hedwig default.properties의 smtp_gateway=<bind-host>:<listen-port>로 연동한다.
  # Hedwig 코드는 변경하지 않는다. 이 리스너에 접수된 메일은 즉시 로컬 스풀에 저장되고, 실제 인터넷 발송은
  # 별도 스레드풀(worker-pool-size~worker-max-pool-size)이 비동기로 처리해 Hedwig 프로세스(IMAP 포함)의
  # 자원을 발신 지연/DNS 지연으로부터 격리한다.
  outbound:
    enabled: true
    bind-host: 127.0.0.1
    listen-port: 2526
    reuse-port: true
    spool-dir: ../spool/outbound
    max-retries: 5
    retry-delay-seconds: 120
    delay-after-retries: 2
    worker-pool-size: 20
    worker-max-pool-size: 40
    delay-worker-pool-size: 5
    delay-worker-max-pool-size: 10
    dns-timeout-millis: 5000
    smtp-connect-timeout-millis: 5000
    smtp-timeout-millis: 5000
    auth-required: false
    auth-username:
    auth-password:
    # 이 게이트웨이를 거쳐 나가는 발신 메일에 DKIM-Signature 헤더를 추가한다 (RFC 6376, relaxed/relaxed,
    # rsa-sha256 고정). 개인키/도메인/셀렉터를 발급받기 전까지는 enabled=false로 두면 아무 영향 없다.
    dkim:
      enabled: false
      domain:
      selector: default
      private-key-path:
      headers-to-sign: [From, To, Subject, Date, Message-ID]
  # 인바운드 메일의 헤더/제목/본문/수신자를 LLM으로 분석해 스팸 여부를 판정한다 (첨부파일은 범위 밖).
  # 판정 결과는 하드 거절이 아니라 X-Spam-* 헤더 태그로만 주입되며, 최종 판단은 사용자/Hedwig sieve 몫이다.
  # enabled=false(기본값)면 SMTP를 파싱하지 않는 기존 순수 바이트 릴레이가 그대로 쓰인다.
  # 분류기 장애/타임아웃은 fail-open(정상 메일로 간주, 태그 없이 전달)으로 처리한다.
  spam-filter:
    enabled: false
    provider: gemma-local   # none | gemma-local | gemini | claude
    timeout-millis: 15000
    max-body-chars: 4000
    worker-pool-size: 4
    gemma:
      base-url: http://localhost:11434
      model: gemma2:7b
    # 실측 비교(2026-09-14, 피싱 메일 샘플)에서 Gemma 7B/Claude/ChatGPT는 정상으로 오판했으나
    # Gemini만 본문 속 발신자 불일치를 잡아내 정확히 스팸 판정 - 정확도 우선이면 provider: gemini 권장.
    gemini:
      api-key:
      model: gemini-3.5-flash-lite
    claude:
      api-key:
      model: claude-3-5-haiku-20241022
  # RBL(DNSBL) 조회 - 발신 IP를 공개 블랙리스트 존에 조회해 알려진 스팸 발신원을 커넥션 단계에서 차단한다.
  # 바이트릴레이/스팸필터 프록시 두 파이프라인 모두에 공통 적용. DNS 조회 실패/타임아웃은 fail-open(허용).
  rbl:
    enabled: false
    zones:
      - zen.spamhaus.org
      - bl.spamcop.net
    timeout-millis: 3000
  # 그레이리스팅 - (발신IP, MAIL FROM, RCPT TO) 삼중항을 처음 보면 450으로 일시 거부하고, 표준 재시도
  # 창 안에서 다시 오면 통과시킨다. RCPT TO를 봐야 하므로 spam-filter와 동일하게 SMTP 종단이 필요하다
  # (spam-filter.enabled와 greylist.enabled 둘 중 하나라도 true면 프록시 파이프라인이 활성화된다).
  # SO_REUSEPORT로 재시도가 다른 인스턴스로 갈 수 있어 상태는 공유 DB(hw_greylist)에 저장한다.
  greylist:
    enabled: false
    min-retry-delay-minutes: 5
    max-window-hours: 24
    trust-period-days: 30
    poll-interval-seconds: 10
  # 전통적인 규칙기반(SpamAssassin류) 스팸 점수 필터. LLM보다 먼저 돌아 확실한 스팸은 LLM 호출 없이
  # 빠르게 걸러낸다 (RCPT TO를 보진 않지만 DATA 본문을 봐야 하므로 spam-filter와 마찬가지로 프록시 필요).
  rule-filter:
    enabled: false
    spam-threshold: 5.0
    extra-keywords: []
  # 관리자/사용자 화이트리스트-블랙리스트. 화이트는 이후 모든 스팸 체크(그레이리스팅/룰기반/LLM)를 건너뛰고,
  # 블랙은 blacklist-action에 따라 즉시 거절(REJECT)하거나 헤더 태그만 강제한다(TAG).
  # 관리는 /admin/mail-list REST API 또는 /admin/dashboard 페이지에서 한다.
  mail-list:
    enabled: false
    blacklist-action: reject   # reject | tag
  # /admin/* API 접근 제어. 비워두면(기본값) 인증 없이 열려있다 - 운영 배포 시 반드시 설정할 것.
  admin:
    api-key:
