# Hedwig hedwig_sql.properties 컨벤션을 답습: <dialect>.<도메인>.<메서드명> 형태로 SQL을 외부화한다.
# SQL은 코드에 직접 쓰지 않고 이 파일에서만 관리한다.

ansi.banlist.findActive = \
  SELECT ip, banned_at, reason, expires_at FROM hw_ban_list WHERE expires_at > ?

ansi.banlist.update = \
  UPDATE hw_ban_list SET banned_at = ?, reason = ?, expires_at = ? WHERE ip = ?

ansi.banlist.insert = \
  INSERT INTO hw_ban_list (ip, banned_at, reason, expires_at) VALUES (?, ?, ?, ?)

# Oracle 방언 별도 필요 시 여기 아래에 oracle.banlist.* 로 override (현재는 ANSI SQL로 충분해 미정의).

ansi.greylist.find = \
  SELECT triplet_hash, first_seen_at, passed_at FROM hw_greylist WHERE triplet_hash = ?

ansi.greylist.update = \
  UPDATE hw_greylist SET first_seen_at = ?, passed_at = ? WHERE triplet_hash = ?

ansi.greylist.insert = \
  INSERT INTO hw_greylist (triplet_hash, first_seen_at, passed_at) VALUES (?, ?, ?)

ansi.maillist.findAll = \
  SELECT list_type, pattern, recipient, reason FROM hw_mail_list

ansi.maillist.insert = \
  INSERT INTO hw_mail_list (list_type, pattern, recipient, reason) VALUES (?, ?, ?, ?)

ansi.maillist.delete = \
  DELETE FROM hw_mail_list WHERE list_type = ? AND pattern = ? AND recipient = ?

ansi.spamrule.findAll = \
  SELECT id, rule_type, pattern, weight, enabled, reason, created_at FROM hw_spam_rule ORDER BY id

ansi.spamrule.insert = \
  INSERT INTO hw_spam_rule (rule_type, pattern, weight, enabled, reason, created_at) VALUES (?, ?, ?, ?, ?, ?)

ansi.spamrule.update = \
  UPDATE hw_spam_rule SET rule_type = ?, pattern = ?, weight = ?, enabled = ?, reason = ? WHERE id = ?

ansi.spamrule.delete = \
  DELETE FROM hw_spam_rule WHERE id = ?

ansi.rulestat.add = \
  UPDATE hw_spam_rule_stat SET hit_count = hit_count + ?, spam_hit_count = spam_hit_count + ?, last_hit_at = ? WHERE rule_id = ?

ansi.rulestat.insert = \
  INSERT INTO hw_spam_rule_stat (rule_id, hit_count, spam_hit_count, last_hit_at) VALUES (?, ?, ?, ?)

ansi.rulestat.findAll = \
  SELECT rule_id, hit_count, spam_hit_count, last_hit_at FROM hw_spam_rule_stat

ansi.rulestat.find = \
  SELECT rule_id, hit_count, spam_hit_count, last_hit_at FROM hw_spam_rule_stat WHERE rule_id = ?

ansi.rulestat.delete = \
  DELETE FROM hw_spam_rule_stat WHERE rule_id = ?

ansi.rulesample.insert = \
  INSERT INTO hw_spam_rule_sample (rule_id, subject, snippet, from_domain, spam_verdict, created_at) VALUES (?, ?, ?, ?, ?, ?)

ansi.rulesample.find = \
  SELECT subject, snippet, from_domain, spam_verdict, created_at FROM hw_spam_rule_sample WHERE rule_id = ? ORDER BY id DESC

ansi.rulesample.ids = \
  SELECT id FROM hw_spam_rule_sample WHERE rule_id = ? ORDER BY id DESC

ansi.rulesample.delete = \
  DELETE FROM hw_spam_rule_sample WHERE id = ?

ansi.rulesample.deleteByRule = \
  DELETE FROM hw_spam_rule_sample WHERE rule_id = ?

ansi.spamreport.insert = \
  INSERT INTO hw_spam_report (reporter, from_domain, subject, snippet, status, rag_added, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)

ansi.spamreport.updateAnalysis = \
  UPDATE hw_spam_report SET status = ?, llm_verdict = ?, llm_score = ?, llm_reason = ?, suggested_pattern = ?, suggested_weight = ?, rag_added = ? WHERE id = ?

ansi.spamreport.updateStatus = \
  UPDATE hw_spam_report SET status = ? WHERE id = ?

ansi.spamreport.updateRag = \
  UPDATE hw_spam_report SET rag_added = ? WHERE id = ?

ansi.spamreport.findRecent = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report ORDER BY id DESC

ansi.spamreport.find = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report WHERE id = ?

ansi.spamreport.findRag = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report WHERE rag_added = ? ORDER BY id DESC

# 신고자 사유 컬럼(reporter_reason). 기존 DB에는 시작 시 SpamReportDao가 probe 후 없으면 addReasonColumn을 한 번 실행한다.
ansi.spamreport.probeReason = \
  SELECT reporter_reason FROM hw_spam_report WHERE 1 = 0

ansi.spamreport.addReasonColumn = \
  ALTER TABLE hw_spam_report ADD reporter_reason VARCHAR(500)

oracle.spamreport.addReasonColumn = \
  ALTER TABLE hw_spam_report ADD (reporter_reason varchar2(500 CHAR))

mssql.spamreport.addReasonColumn = \
  ALTER TABLE hw_spam_report ADD reporter_reason NVARCHAR(500) NULL

ansi.spamreport.updateReason = \
  UPDATE hw_spam_report SET reporter_reason = ? WHERE id = ?

ansi.spamreport.findReasons = \
  SELECT id, reporter_reason FROM hw_spam_report WHERE reporter_reason IS NOT NULL ORDER BY id DESC

ansi.spamreport.findReason = \
  SELECT reporter_reason FROM hw_spam_report WHERE id = ?

# 신고 메일 원본(EML) 파일 이름 컬럼(eml_path). 시작 시 SpamReportDao가 probe 후 없으면 addEmlColumn을 한 번 실행한다.
ansi.spamreport.probeEml = \
  SELECT eml_path FROM hw_spam_report WHERE 1 = 0

ansi.spamreport.addEmlColumn = \
  ALTER TABLE hw_spam_report ADD eml_path VARCHAR(255)

oracle.spamreport.addEmlColumn = \
  ALTER TABLE hw_spam_report ADD (eml_path varchar2(255 CHAR))

mssql.spamreport.addEmlColumn = \
  ALTER TABLE hw_spam_report ADD eml_path NVARCHAR(255) NULL

ansi.spamreport.updateEmlPath = \
  UPDATE hw_spam_report SET eml_path = ? WHERE id = ?

ansi.spamreport.findEmlPaths = \
  SELECT id, eml_path FROM hw_spam_report WHERE eml_path IS NOT NULL ORDER BY id DESC

ansi.spamreport.findEmlPath = \
  SELECT eml_path FROM hw_spam_report WHERE id = ?

ansi.mailevent.insert = \
  INSERT INTO hw_mail_event (event_at, event_day, action, filter_name, client_ip, from_addr, from_domain, rcpt_domain, rcpt_count, subject, score, reason) \
  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

ansi.mailevent.deleteBefore = \
  DELETE FROM hw_mail_event WHERE event_day < ?

ansi.mailevent.summary = \
  SELECT action, COUNT(*) FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? GROUP BY action

ansi.mailevent.daily = \
  SELECT event_day, action, COUNT(*) FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? GROUP BY event_day, action ORDER BY event_day

ansi.mailevent.top = \
  SELECT %COL%, COUNT(*) AS cnt FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? AND (? = 'ALL' OR action = ?) \
  AND %COL% IS NOT NULL GROUP BY %COL% ORDER BY cnt DESC

ansi.mailevent.search = \
  SELECT event_at, action, filter_name, client_ip, from_addr, from_domain, rcpt_domain, rcpt_count, subject, score, reason \
  FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? AND (? = 'ALL' OR action = ?) AND (? = 'ALL' OR filter_name = ?) \
  AND (? = 'ALL' OR client_ip = ?) AND (? = 'ALL' OR from_addr LIKE ?) ORDER BY event_at DESC

ansi.audit.insert = \
  INSERT INTO hw_admin_audit (event_at, actor, source, action, target, before_val, after_val) VALUES (?, ?, ?, ?, ?, ?, ?)

ansi.audit.recent = \
  SELECT event_at, actor, source, action, target, before_val, after_val FROM hw_admin_audit ORDER BY event_at DESC, id DESC

ansi.mailevent.probeAuth = \
  SELECT spf_result, dkim_result, dmarc_result FROM hw_mail_event WHERE 1 = 0

ansi.mailevent.addAuthColumns.1 = ALTER TABLE hw_mail_event ADD COLUMN spf_result VARCHAR(10)
ansi.mailevent.addAuthColumns.2 = ALTER TABLE hw_mail_event ADD COLUMN dkim_result VARCHAR(10)
ansi.mailevent.addAuthColumns.3 = ALTER TABLE hw_mail_event ADD COLUMN dmarc_result VARCHAR(10)
oracle.mailevent.addAuthColumns.1 = ALTER TABLE hw_mail_event ADD (spf_result varchar2(10))
oracle.mailevent.addAuthColumns.2 = ALTER TABLE hw_mail_event ADD (dkim_result varchar2(10))
oracle.mailevent.addAuthColumns.3 = ALTER TABLE hw_mail_event ADD (dmarc_result varchar2(10))

ansi.mailevent.insertAuth = \
  INSERT INTO hw_mail_event (event_at, event_day, action, filter_name, client_ip, from_addr, from_domain, rcpt_domain, rcpt_count, subject, score, reason, spf_result, dkim_result, dmarc_result) \
  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

ansi.mailevent.searchAuth = \
  SELECT event_at, action, filter_name, client_ip, from_addr, from_domain, rcpt_domain, rcpt_count, subject, score, reason, spf_result, dkim_result, dmarc_result \
  FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? AND (? = 'ALL' OR action = ?) AND (? = 'ALL' OR filter_name = ?) \
  AND (? = 'ALL' OR client_ip = ?) AND (? = 'ALL' OR from_addr LIKE ?) ORDER BY event_at DESC

ansi.mailevent.authSummary = \
  SELECT %COL%, COUNT(*) FROM hw_mail_event WHERE event_day >= ? AND event_day <= ? AND %COL% IS NOT NULL GROUP BY %COL%

ansi.quarantine.update = \
  UPDATE hw_quarantine SET eml_file = ?, size_bytes = ? WHERE id = ?

ansi.quarantine.setStatus = \
  UPDATE hw_quarantine SET status = ? WHERE id = ?

ansi.quarantine.find = \
  SELECT id, received_at, client_ip, mail_from, rcpt_list, subject, score, filter_name, reason, auth_summary, status, size_bytes, eml_file \
  FROM hw_quarantine WHERE id = ?

ansi.quarantine.search = \
  SELECT id, received_at, client_ip, mail_from, rcpt_list, subject, score, filter_name, reason, auth_summary, status, size_bytes, eml_file \
  FROM hw_quarantine WHERE received_day >= ? AND received_day <= ? AND (? = 'ALL' OR status = ?) AND (? = 'ALL' OR mail_from LIKE ?) \
  ORDER BY received_at DESC

ansi.quarantine.countByStatus = \
  SELECT status, COUNT(*) FROM hw_quarantine GROUP BY status

ansi.quarantine.findExpired = \
  SELECT id, eml_file FROM hw_quarantine WHERE (status = 'HELD' AND received_day < ?) OR (status <> 'HELD' AND received_day < ?)

ansi.quarantine.delete = \
  DELETE FROM hw_quarantine WHERE id = ?

ansi.quarantine.insert = \
  INSERT INTO hw_quarantine (received_at, received_day, client_ip, mail_from, rcpt_list, subject, score, filter_name, reason, auth_summary, status, size_bytes) \
  VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

ansi.quarantine.countHeldBefore = \
  SELECT COUNT(*) FROM hw_quarantine WHERE status = 'HELD' AND received_day < ?
