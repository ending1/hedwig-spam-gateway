# Hedwig hedwig_sql.properties 컨벤션을 답습: <dialect>.<도메인>.<메서드명> 형태로 SQL을 외부화한다.
# SQL은 코드에 직접 쓰지 않고 이 파일에서만 관리한다.

ansi.banlist.findActive = \
  SELECT ip, banned_at, reason, expires_at FROM hw_ban_list WHERE expires_at > ?

ansi.banlist.update = \
  UPDATE hw_ban_list SET banned_at = ?, reason = ?, expires_at = ? WHERE ip = ?

ansi.banlist.insert = \
  INSERT INTO hw_ban_list (ip, banned_at, reason, expires_at) VALUES (?, ?, ?, ?)

# Oracle 방언 별도 필요 시 여기 아래에 oracle.banlist.* 로 override (현재는 ANSI SQL로 충분해 미정의).

ansi.greylist.find = \
  SELECT triplet_hash, first_seen_at, passed_at FROM hw_greylist WHERE triplet_hash = ?

ansi.greylist.update = \
  UPDATE hw_greylist SET first_seen_at = ?, passed_at = ? WHERE triplet_hash = ?

ansi.greylist.insert = \
  INSERT INTO hw_greylist (triplet_hash, first_seen_at, passed_at) VALUES (?, ?, ?)

ansi.maillist.findAll = \
  SELECT list_type, pattern, recipient, reason FROM hw_mail_list

ansi.maillist.insert = \
  INSERT INTO hw_mail_list (list_type, pattern, recipient, reason) VALUES (?, ?, ?, ?)

ansi.maillist.delete = \
  DELETE FROM hw_mail_list WHERE list_type = ? AND pattern = ? AND recipient = ?

ansi.spamrule.findAll = \
  SELECT id, rule_type, pattern, weight, enabled, reason, created_at FROM hw_spam_rule ORDER BY id

ansi.spamrule.insert = \
  INSERT INTO hw_spam_rule (rule_type, pattern, weight, enabled, reason, created_at) VALUES (?, ?, ?, ?, ?, ?)

ansi.spamrule.update = \
  UPDATE hw_spam_rule SET rule_type = ?, pattern = ?, weight = ?, enabled = ?, reason = ? WHERE id = ?

ansi.spamrule.delete = \
  DELETE FROM hw_spam_rule WHERE id = ?

ansi.rulestat.add = \
  UPDATE hw_spam_rule_stat SET hit_count = hit_count + ?, spam_hit_count = spam_hit_count + ?, last_hit_at = ? WHERE rule_id = ?

ansi.rulestat.insert = \
  INSERT INTO hw_spam_rule_stat (rule_id, hit_count, spam_hit_count, last_hit_at) VALUES (?, ?, ?, ?)

ansi.rulestat.findAll = \
  SELECT rule_id, hit_count, spam_hit_count, last_hit_at FROM hw_spam_rule_stat

ansi.rulestat.find = \
  SELECT rule_id, hit_count, spam_hit_count, last_hit_at FROM hw_spam_rule_stat WHERE rule_id = ?

ansi.rulestat.delete = \
  DELETE FROM hw_spam_rule_stat WHERE rule_id = ?

ansi.rulesample.insert = \
  INSERT INTO hw_spam_rule_sample (rule_id, subject, snippet, from_domain, spam_verdict, created_at) VALUES (?, ?, ?, ?, ?, ?)

ansi.rulesample.find = \
  SELECT subject, snippet, from_domain, spam_verdict, created_at FROM hw_spam_rule_sample WHERE rule_id = ? ORDER BY id DESC

ansi.rulesample.ids = \
  SELECT id FROM hw_spam_rule_sample WHERE rule_id = ? ORDER BY id DESC

ansi.rulesample.delete = \
  DELETE FROM hw_spam_rule_sample WHERE id = ?

ansi.rulesample.deleteByRule = \
  DELETE FROM hw_spam_rule_sample WHERE rule_id = ?

ansi.spamreport.insert = \
  INSERT INTO hw_spam_report (reporter, from_domain, subject, snippet, status, rag_added, created_at) VALUES (?, ?, ?, ?, ?, ?, ?)

ansi.spamreport.updateAnalysis = \
  UPDATE hw_spam_report SET status = ?, llm_verdict = ?, llm_score = ?, llm_reason = ?, suggested_pattern = ?, suggested_weight = ?, rag_added = ? WHERE id = ?

ansi.spamreport.updateStatus = \
  UPDATE hw_spam_report SET status = ? WHERE id = ?

ansi.spamreport.updateRag = \
  UPDATE hw_spam_report SET rag_added = ? WHERE id = ?

ansi.spamreport.findRecent = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report ORDER BY id DESC

ansi.spamreport.find = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report WHERE id = ?

ansi.spamreport.findRag = \
  SELECT id, reporter, from_domain, subject, snippet, status, llm_verdict, llm_score, llm_reason, suggested_pattern, suggested_weight, rag_added, created_at FROM hw_spam_report WHERE rag_added = ? ORDER BY id DESC
